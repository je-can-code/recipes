title: Custard Pie

intro: >-
  A classic egg custard pie: a crisp, buttery crust around a deep, silky custard of cream, egg yolks and
  vanilla, baked low until it barely sets and grated with fresh nutmeg. This one is dressed for company, with
  a tall fluted edge and a scatter of sugared pastry stars that stay crisp on the soft custard. The gentle
  heat a custard needs is something even a weak oven does well.

serves: 8
time: about 4 hours 15 minutes, plus 4 hours cooling and chilling
tags: [ dessert, baking, game, star-ocean, so4 ]

ingredients:
  - name: Crust and stars
    items:
      - 1 1/2 cups all-purpose flour
      - 1 tbsp sugar
      - 1/2 tsp salt
      - 10 tbsp (1 1/4 sticks) cold unsalted butter
      - 4 to 6 tbsp ice water
      - 1 egg white, beaten, left over from the custard's yolks
      - 1 tbsp turbinado (raw) sugar, like Sugar in the Raw
      - A 9-inch pie plate
      - A small star cutter, about 1 1/2 inches across
      - Pie weights, or about 4 cups dried beans or rice
  - name: Custard
    items:
      - 1 1/2 cups heavy cream
      - 1 cup whole milk
      - 1/2 cup sugar
      - 1/4 tsp salt
      - 1 vanilla bean, or 2 tsp vanilla extract
      - 2 eggs
      - 4 egg yolks
      - 1 whole nutmeg, for grating
    after: >-
      Whole nutmeg and vanilla beans are in the spice aisle. Grate the nutmeg on a Microplane or the finest
      side of a box grater. Pre-ground works, but fresh is what makes a custard pie smell like one.

method:
  steps:
    - lead: Make the dough.
      text: >-
        Whisk the flour, sugar and salt in a big bowl. Cut the butter into 1/2-inch cubes and toss them in the
        flour. Press each cube flat between your fingertips, working fast so the butter stays cold, until the
        biggest pieces look like flattened peas. Those flat flakes of butter are what make the crust flaky.
    - lead: Add the water.
      text: >-
        Sprinkle 4 tbsp of the ice water over and toss with a fork until it starts to clump. Squeeze a handful:
        if it holds together, it's ready. If it crumbles, add more water 1 tbsp at a time. Press it into a disk
        about 1 inch thick, wrap it, and refrigerate for at least 1 hour.
    - lead: Line the plate.
      text: >-
        On a floured counter, roll the dough into a 13-inch circle, giving it a quarter turn every few rolls so
        it doesn't stick. Ease it into the pie plate without stretching it, since stretched dough shrinks in the
        oven. Trim the overhang to 1 inch with scissors, and save the trimmings for the stars.
    - lead: Flute a tall edge.
      text: >-
        Fold the overhang under itself so it stands up on the rim of the plate in a thick rope. Press the tip
        of one index finger into the inside of the rope, pinch the dough around it from the outside with the
        thumb and finger of your other hand, and repeat every inch all the way around. The tall, wavy edge holds
        more custard, and it frames the whole pie.
    - lead: Chill the shell.
      text: >-
        Prick the bottom all over with a fork and refrigerate the shell for 1 hour, until firm. Cold dough
        holds its shape in the oven instead of slumping down the sides.
    - lead: Cut the stars.
      text: >-
        Press the trimmings together, roll them 1/8 inch thick, and cut out as many stars as you can,
        re-rolling the scraps once. You should get about 20. Lay them on a parchment-lined plate and
        refrigerate them.
    - lead: Heat the oven.
      text: >-
        While the shell chills, put a rimmed baking sheet on the lowest rack and heat the oven to 375°F for a
        good 20 minutes, longer than the beep says. The hot sheet gets heat into the bottom crust.
    - lead: Bake the shell with weights.
      text: >-
        Line the cold shell with foil, pressing it into the corners and over the fluted edge, and fill it to the
        top with the weights. Set it on the hot sheet and bake for 25 minutes, until the edge looks dry and is
        just turning pale gold.
    - lead: Bake it bare.
      text: >-
        Lift out the foil and weights together, carefully, and bake the shell for 10 to 15 minutes more, until
        the bottom looks dry and golden all over. If it puffs up, press it down gently with the back of a spoon.
        Take it all the way: a pale shell turns soggy under custard.
    - lead: Seal the bottom.
      text: >-
        Brush the inside of the hot shell with a thin coat of the beaten egg white and bake for 2 minutes more,
        until it looks glossy and set. That thin seal keeps the custard from soaking in. Take the shell out,
        leave the sheet in, and turn the oven down to 325°F.
    - lead: Bake the stars.
      text: >-
        Brush the stars with the rest of the egg white and sprinkle them with the turbinado sugar. Lay them on
        a piece of parchment cut to fit the air fryer basket and air fry at 350°F for 5 to 7 minutes, until
        golden. Cool them on a rack.
    - lead: Warm the cream.
      text: >-
        Split the vanilla bean lengthwise, scrape the seeds into a pot, and drop in the pod. Add the cream,
        milk, sugar and salt, and heat over medium-low, stirring, for 5 to 7 minutes, until the sugar dissolves
        and the cream steams and reads about 150°F. Don't let it simmer.
    - lead: Mix the custard.
      text: >-
        Whisk the eggs and yolks in a bowl just to break them up, cutting through them rather than beating, so
        you don't whip in air. Pour in the warm cream slowly, whisking gently. Stir in the vanilla extract now
        if you're using it instead of the bean.
    - lead: Strain it.
      text: >-
        Pour the custard through a fine strainer into a large measuring cup, which catches the pod and any
        stray bits of egg, then skim the foam off the top with a spoon. Bubbles left in bake into pockmarks.
    - lead: Fill it in the oven.
      text: >-
        Set the shell back on the hot sheet in the oven and slide the rack out partway. Pour in the custard
        until it comes just below the fluted edge, and grate a generous dusting of nutmeg over the top. Then
        slide the rack back in gently. Filling it in place saves carrying a brimming pie across the kitchen.
    - lead: Bake low.
      text: >-
        Bake for 35 to 50 minutes, until the edge is set and the middle 3 inches wobble as one piece when you
        nudge the pie, like Jell-O, with no liquid sloshing underneath. The center reads about 175°F. Check at
        35 minutes. If the crust edge darkens too fast, cover it with strips of foil.
    - lead: Cool, then chill.
      text: >-
        Let the pie cool on a rack for 2 hours. The middle finishes setting as it cools. Then refrigerate it
        for at least 2 hours, until cold all the way through, so it slices cleanly.
    - lead: Add the stars and serve.
      text: >-
        Right before serving, scatter the stars over the top, a few in a cluster and the rest spread out like a
        constellation. Cut the pie with a thin knife dipped in hot water and wiped dry between slices.

notes:
  - lead: "Store-bought crust:"
    text: >-
      one refrigerated rolled crust works for the shell. Roll it out to 12 inches first so there's enough to
      flute a tall edge, and cut the stars from the second crust in the box.
  - lead: "Cracked or weepy:"
    text: >-
      the custard baked too long. It still tastes good. Next time take it out while the middle still wobbles,
      since it keeps cooking as it cools.
  - lead: "Extra custard:"
    text: >-
      if some doesn't fit, pour it into a ramekin, set that in a small baking dish with 1 inch of hot water,
      and bake it beside the pie for 25 to 35 minutes, until it wobbles as one piece. It's the cook's share.
  - lead: "No star cutter:"
    text: >-
      draw a star about 1 1/2 inches across on stiff paper, cut it out, lay it on the dough, and cut around it
      with the tip of a paring knife.
  - lead: "Storage:"
    text: >-
      covered, in the fridge, for up to 3 days. Keep the stars in an airtight container at room temperature
      and add them as you serve, since they soften on the custard after about 1 hour.

# The games with a shelf of their own on the home page, in the order their chips appear, after Home
# Cooking and any collections.
#
# Each game has three fields:
#   tag    the tag its recipes carry, like so2. A dish from several games carries each game's tag.
#   label  the short name on the shelf's chip, like SO2.
#   name   the full name over the shelf's list.
#
# Every recipe from a game also carries the game tag, which keeps it off Home Cooking. A new game is one
# more entry here, plus its tags on its cards. The site picks up a change here on the next page load, and
# the check command (`recipes check`) reports any mistake in this file, along with any game's dish whose
# game isn't listed.

- tag: so1
  label: SO1
  name: "Star Ocean: First Departure"

- tag: so2
  label: SO2
  name: "Star Ocean: The Second Story"

- tag: so3
  label: SO3
  name: "Star Ocean: Till the End of Time"

- tag: so4
  label: SO4
  name: "Star Ocean: The Last Hope"

- tag: so5
  label: SO5
  name: "Star Ocean: Integrity and Faithlessness"

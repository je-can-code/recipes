title: Rice Omelet

intro: >-
  Omurice: ketchup chicken rice under a thin omelet, with more ketchup on top. This is the old-school
  wrapped kind, with the egg cooked all the way through, not the soft one that gets split open over the
  rice.

serves: 2
time: about 35 minutes
scales: true
tags: [ chicken, dinner, game, star-ocean, so1, so2 ]

ingredients:
  - name: Chicken rice
    items:
      - 1 chicken thigh (about 1/2 lb), boneless and skinless, cut into 1/2-inch pieces {chicken}
      - 1/2 onion, diced small {onion}
      - 1 tbsp butter {butter}
      - 1 tbsp neutral oil {oil}
      - 1/2 cup frozen peas or mixed vegetables, optional {peas}
      - 1/4 cup ketchup, plus more for the top {ketchup}
      - 3 cups cooked rice, day-old or straight from the rice cooker {rice}
      - Salt and black pepper
  - name: Omelets
    items:
      - 6 eggs
      - 2 tbsp milk
      - 2 pinches salt
      - 2 tbsp butter

method:
  steps:
    - lead: Brown the chicken.
      text: >-
        Heat {oil} and {butter} in the skillet over medium. Add {chicken} with a pinch of salt and pepper
        and cook for 5 to 6 minutes, stirring now and then, until it's lightly browned and no longer pink.
    - lead: Add the onion.
      text: >-
        Add {onion} and cook for 3 to 4 minutes, until soft and see-through. Stir in {peas}, if using, for
        the last minute.
    - lead: Cook the ketchup.
      text: >-
        Push everything to one side, squeeze {ketchup} onto the bare part of the pan, and let it bubble
        for about a minute, until it darkens a shade. Cooking it first takes off the raw, sharp edge.
    - lead: Add the rice.
      text: >-
        Add {rice}, breaking up any clumps, and toss until every grain is evenly orange, 2 to 3 minutes.
        Taste and adjust with salt, pepper or another squeeze of ketchup.
    - lead: Shape the rice.
      text: >-
        Divide it between the plates, one per person, and shape each share into a mound like a fat football.
        Packing it into a bowl and turning it out works too. Wipe out the skillet.
    - lead: Beat the eggs.
      text: >-
        Make one omelet per plate. For each omelet, beat 3 eggs with 1 tbsp milk and a pinch of salt until
        there are no streaks of white left.
    - lead: Heat the pan properly.
      text: >-
        Put the empty skillet over medium for about 2 minutes, until a drop of water skitters across it.
        Add 1 tbsp butter for each omelet and swirl it around. When the foaming settles, the pan is ready. A
        hot pan and foamy butter are what keep eggs from sticking to stainless.
    - lead: Cook the omelet thin and all the way through.
      text: >-
        Pour in the eggs and tilt the pan so they spread into a wide, thin sheet. Leave it alone for 1 to 2
        minutes, until the bottom is set. Turn the heat to low, cover with any lid big enough (a pot lid
        works), and give it 30 to 60 seconds, until the top is dry with no wet egg left.
    - lead: Drape it over the rice.
      text: >-
        Loosen the edges with a spatula and slide the omelet out over one of the rice mounds. Press it
        down around the sides with a paper towel and tuck the edges under to make a neat oval.
    - lead: Make the rest.
      text: >-
        Same pan, same steps, with the rest of the eggs, milk, salt and butter, until every plate has its
        omelet.
    - lead: Finish.
      text: >-
        Zigzag ketchup over the top of each and serve.

notes:
  - lead: "Sticking:"
    text: >-
      the pan wasn't hot enough, or the butter went in too early. A nonstick pan makes this easy if you have
      one.
  - lead: "Torn omelet:"
    text: >-
      it tastes exactly the same. Patch the gap with a torn-off piece and hide the seam under ketchup.
  - lead: "Sauce instead of ketchup:"
    text: >-
      simmer {3 tbsp} ketchup, {1 tbsp} Worcestershire, {1 tbsp} butter and {1 tbsp} water for a minute and
      spoon it over.
  - lead: "Cold rice:"
    text: >-
      rice from the fridge fries up best. Break it up with your hands before it goes in.

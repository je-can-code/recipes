title: Fruit Punch

intro: >-
  A pitcher of tropical punch for a crowd: pineapple, orange and mango juices brightened with lime, then
  topped with soda water right before serving, so it stays fizzy and doesn't get too sweet.

makes: about 9 cups, 8 to 10 glasses
time: about 10 minutes, plus chilling
tags: [ drink, game, star-ocean, so1 ]

ingredients:
  - items:
      - 3 cups pineapple juice, chilled
      - 2 cups orange juice, chilled
      - 1 cup mango or guava nectar, chilled
      - 1/4 cup lime juice (about 2 limes)
      - 2 tbsp grenadine, optional, for a redder punch
      - 3 cups soda water or ginger ale, chilled
      - 1 orange and 1 lime, sliced into thin rounds
      - 1 cup strawberries, hulled and halved, or pineapple chunks
      - Ice

method:
  steps:
    - lead: Mix the juices.
      text: >-
        Stir the pineapple juice, orange juice, nectar, lime juice and grenadine together in a big pitcher
        or bowl. Taste it: another squeeze of lime makes it brighter. Keep it in the fridge until serving.
        It holds for a day.
    - lead: Add the fruit.
      text: >-
        Drop in the orange and lime rounds and the strawberries.
    - lead: Add the fizz at the last minute.
      text: >-
        Right before serving, pour in the soda water or ginger ale and stir once, gently, to keep the
        bubbles.
    - lead: Serve.
      text: >-
        Pour it over ice, with a few pieces of fruit in each glass.

notes:
  - lead: "Too sweet:"
    text: >-
      add more soda water and a squeeze of lime.
  - lead: "Too tart:"
    text: >-
      add more pineapple juice.
  - lead: Soda water or ginger ale?
    text: >-
      Soda water keeps it fruit-forward and less sweet. Ginger ale makes it sweeter, with a little spice.
  - lead: "Cold without watering down:"
    text: >-
      freeze a cup or two of the juice mix in an ice cube tray the night before and use those instead of
      ice.

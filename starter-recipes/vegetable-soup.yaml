title: Vegetable Soup

intro: >-
  Minestrone, Italy's big vegetable soup: a slow base of onion, carrot and celery, then tomatoes, beans,
  greens and small pasta, with a Parmesan rind simmered in for depth. Garlicky toasted breadcrumbs go on
  top for crunch.

serves: 6
time: about 1 hour 30 minutes
scales: true
tags: [ vegetarian, soup, game, star-ocean, so1, so5 ]

ingredients:
  - name: Soup
    items:
      - 3 tbsp olive oil {olive-oil}
      - 1 onion, diced {onion}
      - 2 carrots, diced {carrots}
      - 2 celery ribs, diced {celery}
      - 3 cloves garlic, minced {garlic}
      - 1 tbsp tomato paste {tomato-paste}
      - 1 can (14.5 oz each) diced tomatoes {tomatoes}
      - 6 cups vegetable broth {broth}
      - 1 Parmesan rind, about 3 inches, plus grated Parmesan to serve
      - 1 bay leaf
      - 1 tsp dried oregano {oregano}
      - 1 medium Yukon Gold potato, diced {potato}
      - 1 cup green beans, cut into 1-inch pieces {green-beans}
      - 1 medium zucchini, diced {zucchini}
      - 1 can (15 oz each) cannellini beans, drained and rinsed {beans}
      - 3 cups chopped kale or Swiss chard, stems removed {greens}
      - 1/2 cup small pasta, like ditalini or small shells {pasta}
      - Salt and black pepper
      - Good olive oil, for drizzling
    after: >-
      Save the rind ends of your Parmesan wedges in the freezer for this. Some cheese counters sell rinds
      on their own, too.
  - name: Crunchy breadcrumbs
    items:
      - 1 cup panko or coarse dry breadcrumbs {panko}
      - 2 tbsp olive oil
      - 1 clove garlic, grated
      - 1 pinch red pepper flakes
      - 1/2 lemon, zested
      - 1 pinch salt

method:
  steps:
    - lead: Cook the base slowly.
      text: >-
        Heat {olive-oil} in a big pot over medium. Add {onion}, {carrots}, {celery} and a pinch of salt and
        cook for 10 to 12 minutes, stirring now and then, until soft and sweet and just starting to color.
        This slow start is where most of the flavor comes from.
    - lead: Add the garlic and tomato paste.
      text: >-
        Stir in {garlic} and {tomato-paste} and cook for 2 minutes, until the paste darkens a shade.
    - lead: Add the liquids.
      text: >-
        Add {tomatoes}, {broth}, the Parmesan rind, the bay leaf, {oregano} and {potato}. Bring it to a boil
        with the lid on, then simmer with the lid ajar for 15 minutes.
    - lead: Add the green beans, zucchini and beans.
      text: >-
        Add {green-beans}, {zucchini} and {beans}, and simmer for 10 minutes more.
    - lead: Add the pasta and greens.
      text: >-
        Stir in {pasta} and {greens} and simmer for 10 to 12 minutes, stirring now and then so the pasta
        doesn't stick, until the pasta is tender. If it gets too thick, add water a splash at a time.
    - lead: Toast the breadcrumbs.
      text: >-
        While the pasta cooks, heat the {2 tbsp} olive oil in the skillet over medium. Add {panko} and stir
        constantly for 3 to 5 minutes, until it's golden and crisp. Take it off the heat, stir in the
        garlic, pepper flakes, lemon zest and salt, and tip it into a bowl so it stops cooking.
    - lead: Season and serve.
      text: >-
        Fish out the rind and bay leaf and season with salt and pepper. Ladle into bowls, drizzle with good
        olive oil, and top with grated Parmesan and a big spoonful of the crumbs.

notes:
  - lead: "With pesto:"
    text: >-
      stir a spoonful of basil pesto into each bowl instead of the olive oil.
  - lead: "Swaps:"
    text: >-
      use whatever's in season. Peas, butternut squash, cabbage and spinach all belong here.
  - lead: Leftovers
    text: >-
      the pasta keeps drinking the broth, so add water when you reheat. To freeze it, leave the pasta out
      and cook it fresh when you reheat.
  - lead: "Crumbs ahead:"
    text: >-
      the breadcrumbs keep for 3 days in a sealed jar.

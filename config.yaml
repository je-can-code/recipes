# Where the recipe cards live. A relative path is read from this file's folder.
recipesFolder: /mnt/exdrive/docs/recipes

# Where the site listens for plain http. 0.0.0.0 lets phones and tablets on the same Wi-Fi reach it, and
# port 80 means the address needs no port number. With certificates, http sends everyone to https, apart
# from http://recipes.local/trust, where a new device goes first. Linux keeps ports below 1024 for admins
# unless told otherwise, and /etc/sysctl.d/60-recipes-port-80.conf lets ordinary programs use 80 and up.
listen: 0.0.0.0:80

# The site's https certificate and the certificate authority that signed it, as `bun run certs` makes them.
# Browsers only allow keeping the screen on for https sites. This folder holds the authority's private key,
# so it stays on this machine and out of git.
certificates: certs

# Where https listens. 443 is https's usual port, so the address needs no port number.
listenSecure: 0.0.0.0:443

# The site's own name on the Wi-Fi, so the address is http://recipes.local. While the site runs, Avahi (the
# program that already answers for j-desktop.local) answers for this name too, and j-desktop.local keeps
# working. It has to be one word and .local, since phones and laptops won't look up anything longer.
name: recipes.local
